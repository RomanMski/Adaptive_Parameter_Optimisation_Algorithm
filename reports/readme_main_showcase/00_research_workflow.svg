<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>

  <text x="60" y="58" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">
    Adaptive Parameter Optimisation Algorithm
  </text>
  <text x="60" y="92" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    Market research, adaptive parameter ranges, cost-aware backtesting, and robustness review.
  </text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="55" y="145" width="170" height="105" rx="18" fill="url(#box)" stroke="#334155"/>
    <text x="140" y="184" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Market data</text>
    <text x="140" y="214" text-anchor="middle" fill="#94a3b8" font-size="13">commodities · FX</text>

    <rect x="275" y="145" width="170" height="105" rx="18" fill="url(#box)" stroke="#334155"/>
    <text x="360" y="184" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Research</text>
    <text x="360" y="214" text-anchor="middle" fill="#94a3b8" font-size="13">signal behaviour</text>

    <rect x="495" y="145" width="190" height="105" rx="18" fill="url(#box)" stroke="#334155"/>
    <text x="590" y="184" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Parameter search</text>
    <text x="590" y="214" text-anchor="middle" fill="#94a3b8" font-size="13">MA windows · thresholds</text>

    <rect x="735" y="145" width="190" height="105" rx="18" fill="url(#box)" stroke="#334155"/>
    <text x="830" y="184" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Backtest</text>
    <text x="830" y="214" text-anchor="middle" fill="#94a3b8" font-size="13">fees · slippage · exits</text>

    <rect x="975" y="145" width="170" height="105" rx="18" fill="url(#box)" stroke="#334155"/>
    <text x="1060" y="184" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Review</text>
    <text x="1060" y="214" text-anchor="middle" fill="#94a3b8" font-size="13">robustness · visuals</text>

    <line x1="225" y1="197" x2="270" y2="197" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="445" y1="197" x2="490" y2="197" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="685" y1="197" x2="730" y2="197" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="925" y1="197" x2="970" y2="197" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M1060 255 C1060 310 590 315 590 258" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="800" y="318" text-anchor="middle" fill="#94a3b8" font-size="14">
      use results to refine the next search area
    </text>
  </g>
</svg>